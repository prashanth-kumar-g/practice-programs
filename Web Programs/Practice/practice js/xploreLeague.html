<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xplore League</title>

    <link rel="stylesheet" href="xploreLeague.css">
</head>

<body>

    <h1>Xplore League Question Problem with Solution</h1>

    <div class="container">

        <!-- Row and column inputs -->

        <div class="dimensionInputs">

            <div class="formGroup">
                <label for="rows">Enter number of rows:</label>
                <input type="number" id="rows" name="rows">
            </div>

            <div class="formGroup">
                <label for="cols">Enter number of columns:</label>
                <input type="number" id="cols" name="cols">
            </div>

        </div>

        <!-- Generate Matrix button -->

        <button type="button" id="generateBtn">
            Generate Matrix
        </button>

        <!-- Matrix input section -->

        <div class="arrayInput" id="arrayInput">

            <label class="sectionLabel" for="arrayFields">
                Enter array elements:
            </label>

            <div id="arrayFields" class="matrix"></div>

        </div>

        <!-- Solve button -->

        <button type="button" id="solveBtn">
            Solve
        </button>

        <!-- Output section -->

        <div class="outputSection" id="outputSection">

            <label class="sectionLabel">Output:</label>

            <div id="outputFields" class="outputArray"></div>

        </div>

        <!-- Error messages -->

        <p id="message" role="status" aria-live="polite"></p>

    </div>

    <script src="xploreLeague.js"></script>

</body>

</html>
